<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>강의자료 열쇠함</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a6470">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 왼쪽은 작업대(파일 투입구와 결과), 오른쪽은 열쇠고리처럼 꼬리표가 매달린 열쇠함 */
:root {
  --bg: #e7edf1; --panel: #fbfcfd; --line: #c9d4dc; --ink: #14232e; --muted: #526473;
  --accent: #0a6470; --accent-ink: #ffffff; --accent-soft: #d6e9ec;
  --brass: #8a5c0c; --tag: #f5e7c6; --tag-line: #d9bf85;
  --ok: #17693f; --ok-soft: #d9efe2; --bad: #a82a20; --bad-soft: #f8dfdc; --quiet-soft: #e4e9ed;
  --display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f171d; --panel: #172229; --line: #2c3c47; --ink: #e5edf2; --muted: #9db0be;
  --accent: #5cc6d2; --accent-ink: #06262b; --accent-soft: #173a41;
  --brass: #e4b75c; --tag: #33291a; --tag-line: #6b5427;
  --ok: #6fd6a0; --ok-soft: #173a2a; --bad: #ff9a90; --bad-soft: #43201d; --quiet-soft: #24313a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f171d; --panel: #172229; --line: #2c3c47; --ink: #e5edf2; --muted: #9db0be;
  --accent: #5cc6d2; --accent-ink: #06262b; --accent-soft: #173a41;
  --brass: #e4b75c; --tag: #33291a; --tag-line: #6b5427;
  --ok: #6fd6a0; --ok-soft: #173a2a; --bad: #ff9a90; --bad-soft: #43201d; --quiet-soft: #24313a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--body); word-break: keep-all; overflow-wrap: anywhere; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; }
h1 { font: 400 34px/1.15 var(--display); margin: 0; letter-spacing: .01em; }
header p { margin: 0; color: var(--muted); }
.board { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 22px; align-items: start; }
.bench { display: grid; gap: 16px; min-width: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 7px 12px; font-weight: 500; }
button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(1.1); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.drop { border: 2px dashed var(--line); border-radius: 12px; background: var(--panel); padding: 26px 20px; display: grid; justify-items: center; gap: 10px; text-align: center; transition: border-color .12s, background .12s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { font: 400 22px/1.25 var(--display); }
.drop span { color: var(--muted); font-size: 14px; }

.tray { display: grid; gap: 10px; min-width: 0; }
.tray-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; min-height: 38px; }
.tally { font-weight: 600; margin-right: auto; font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
.row.sample { opacity: .72; border-style: dashed; }
.lock { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--quiet-soft); color: var(--muted); }
.lock svg { width: 18px; height: 18px; display: block; }
.row[data-s="done"] .lock { background: var(--ok-soft); color: var(--ok); }
.row[data-s="wrong"] .lock, .row[data-s="error"] .lock { background: var(--bad-soft); color: var(--bad); }
.row[data-s="working"] .lock { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .row[data-s="working"] .lock { animation: none; } }
.meta { min-width: 0; }
.fname { font-weight: 500; overflow-wrap: anywhere; }
.state { font-size: 13.5px; color: var(--muted); }
.row[data-s="done"] .state b { color: var(--ok); font-weight: 600; }
.row[data-s="wrong"] .state b, .row[data-s="error"] .state b { color: var(--bad); font-weight: 600; }
.acts { display: flex; gap: 6px; }
.acts button { padding: 5px 10px; font-size: 14px; }
.chip { font-size: 12px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; letter-spacing: .02em; }
.example-note { color: var(--muted); font-size: 13.5px; margin: 0; }

.ring { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.ring h2 { font: 400 22px/1.2 var(--display); margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
.ring h2 small { font: 500 13px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
form { display: grid; gap: 8px; }
label { display: grid; gap: 3px; font-size: 13px; font-weight: 500; color: var(--muted); }
input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); font-size: 15px; }
input#kPw { font-family: var(--mono); }
.form-msg { font-size: 13px; color: var(--bad); min-height: 0; margin: 0; }
.tags { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tag { position: relative; background: var(--tag); border: 1px solid var(--tag-line); border-radius: 4px 8px 8px 4px; padding: 8px 10px 8px 32px; display: grid; gap: 2px; min-width: 0; }
.tag::before { content: ""; position: absolute; left: 11px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--brass); }
.tag-top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; min-width: 0; }
.tag-name { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.tag-hits { font-size: 12.5px; color: var(--brass); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tag-pw { font: 500 13.5px var(--mono); overflow-wrap: anywhere; color: var(--muted); }
.tag-acts { display: flex; gap: 12px; }
.link { border: 0; background: none; padding: 0; font-size: 13px; color: var(--brass); text-decoration: underline; text-underline-offset: 2px; font-weight: 500; }
.link:hover:not(:disabled) { color: var(--ink); }
.link.armed { color: var(--bad); font-weight: 600; }
.empty-keys { color: var(--muted); font-size: 14px; margin: 0; }
.ring-foot { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.ring-foot div { display: flex; gap: 14px; flex-wrap: wrap; }
.ring-foot .link { color: var(--accent); }
.fine { color: var(--muted); font-size: 12.5px; margin: 0; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-weight: 500; max-width: calc(100vw - 32px); }
@media (max-width: 820px) {
  .board { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 30px; }
}
@media (max-width: 460px) {
  .row { grid-template-columns: 34px minmax(0, 1fr); }
  .acts { grid-column: 2; }
}
</style>

<div class="wrap">
  <header>
    <h1>강의자료 열쇠함</h1>
    <p>잠긴 PDF를 넣으면 등록한 암호를 알아서 대입해 풀어 줍니다.</p>
  </header>
  <div class="board">
    <main class="bench">
      <div class="drop" id="drop">
        <strong>잠긴 PDF를 여기에 끌어다 놓으세요</strong>
        <span>여러 파일을 한 번에 넣을 수 있습니다</span>
        <button class="primary" id="pick" type="button">PDF 선택</button>
        <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
      </div>
      <section class="tray" aria-label="처리 결과">
        <div class="tray-head" id="trayHead" hidden>
          <span class="tally" id="tally" aria-live="polite"></span>
          <button id="saveAll" class="primary" type="button"></button>
          <button id="clear" type="button">목록 비우기</button>
        </div>
        <p class="example-note" id="exampleNote">파일을 넣으면 아래처럼 표시됩니다.</p>
        <ul class="rows" id="rows"></ul>
      </section>
    </main>
    <aside class="ring" aria-label="열쇠함">
      <h2>열쇠함 <small id="keyCount"></small></h2>
      <form id="keyForm" autocomplete="off">
        <label>과목명 <input id="kLabel" type="text" placeholder="운영체제" maxlength="40" autocomplete="off"></label>
        <label>암호 <input id="kPw" type="text" placeholder="교수님이 정한 암호" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
        <p class="form-msg" id="formMsg" hidden></p>
        <button class="primary" type="submit">열쇠 추가</button>
      </form>
      <ul class="tags" id="tags"></ul>
      <p class="empty-keys" id="noKeys">아직 열쇠가 없습니다. 과목별 암호를 위에 등록하면 다음부터는 PDF만 넣으면 됩니다.</p>
      <div class="ring-foot">
        <div>
          <button class="link" id="backup" type="button">백업 저장</button>
          <button class="link" id="restore" type="button">백업 불러오기</button>
          <input id="restoreFile" type="file" accept=".json,application/json" hidden>
        </div>
        <p class="fine" id="privacy">PDF와 암호는 이 브라우저 안에서만 처리되고 밖으로 전송되지 않습니다. 열쇠는 이 기기의 이 브라우저에 저장되므로, 다른 기기에서는 백업 파일을 불러오세요. 백업 파일에는 암호가 그대로 들어 있습니다.</p>
      </div>
    </aside>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script>
/* PDF 표준 보안 처리기 복호화 엔진. 외부 라이브러리 없이 브라우저 안에서만 동작한다.
   지원: RC4 40/128비트(R2-R4), AES-128(R4), AES-256(R5, R6). */
const PDFUnlock = (() => {
  /* ---------- 바이트 도우미 ---------- */
  const cat = (...parts) => {
    let n = 0;
    for (const p of parts) n += p.length;
    const out = new Uint8Array(n);
    let i = 0;
    for (const p of parts) { out.set(p, i); i += p.length; }
    return out;
  };
  const ascii = s => { const o = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) o[i] = s.charCodeAt(i) & 255; return o; };
  const latin1 = b => { let s = ''; for (let i = 0; i < b.length; i += 32768) s += String.fromCharCode.apply(null, b.subarray(i, i + 32768)); return s; };
  const utf8 = s => new TextEncoder().encode(s);
  const eq = (a, b, n) => { for (let i = 0; i < n; i++) if (a[i] !== b[i]) return false; return true; };
  const indexOf = (b, pat, from = 0, to = b.length) => {
    const p = ascii(pat), last = Math.min(to, b.length) - p.length;
    outer: for (let i = from; i <= last; i++) {
      if (b[i] !== p[0]) continue;
      for (let j = 1; j < p.length; j++) if (b[i + j] !== p[j]) continue outer;
      return i;
    }
    return -1;
  };
  const lastIndexOf = (b, pat, from = b.length - 1) => {
    const p = ascii(pat);
    outer: for (let i = Math.min(from, b.length - p.length); i >= 0; i--) {
      for (let j = 0; j < p.length; j++) if (b[i + j] !== p[j]) continue outer;
      return i;
    }
    return -1;
  };

  /* ---------- 해시와 암호 ---------- */
  const MD5_S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
  const MD5_K = new Int32Array(64);
  for (let i = 0; i < 64; i++) MD5_K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;

  function md5(data) {
    const n = data.length, padded = new Uint8Array(((n + 8) >> 6) * 64 + 64);
    padded.set(data);
    padded[n] = 0x80;
    const dv = new DataView(padded.buffer);
    dv.setUint32(padded.length - 8, (n * 8) >>> 0, true);
    dv.setUint32(padded.length - 4, Math.floor(n / 536870912), true);
    let a0 = 0x67452301, b0 = 0xefcdab89 | 0, c0 = 0x98badcfe | 0, d0 = 0x10325476;
    const M = new Int32Array(16);
    for (let off = 0; off < padded.length; off += 64) {
      for (let i = 0; i < 16; i++) M[i] = dv.getInt32(off + i * 4, true);
      let a = a0, b = b0, c = c0, d = d0;
      for (let i = 0; i < 64; i++) {
        let f, g;
        const r = i >> 4;
        if (r === 0) { f = (b & c) | (~b & d); g = i; }
        else if (r === 1) { f = (d & b) | (~d & c); g = (5 * i + 1) & 15; }
        else if (r === 2) { f = b ^ c ^ d; g = (3 * i + 5) & 15; }
        else { f = c ^ (b | ~d); g = (7 * i) & 15; }
        const t = (a + f + MD5_K[i] + M[g]) | 0, s = MD5_S[(r << 2) | (i & 3)];
        a = d; d = c; c = b;
        b = (b + ((t << s) | (t >>> (32 - s)))) | 0;
      }
      a0 = (a0 + a) | 0; b0 = (b0 + b) | 0; c0 = (c0 + c) | 0; d0 = (d0 + d) | 0;
    }
    const out = new Uint8Array(16), odv = new DataView(out.buffer);
    odv.setInt32(0, a0, true); odv.setInt32(4, b0, true); odv.setInt32(8, c0, true); odv.setInt32(12, d0, true);
    return out;
  }

  function rc4(key, data) {
    const S = new Uint8Array(256);
    for (let i = 0; i < 256; i++) S[i] = i;
    for (let i = 0, j = 0; i < 256; i++) {
      j = (j + S[i] + key[i % key.length]) & 255;
      const t = S[i]; S[i] = S[j]; S[j] = t;
    }
    const out = new Uint8Array(data.length);
    for (let n = 0, i = 0, j = 0; n < data.length; n++) {
      i = (i + 1) & 255;
      const t = S[i];
      j = (j + t) & 255;
      S[i] = S[j]; S[j] = t;
      out[n] = data[n] ^ S[(S[i] + t) & 255];
    }
    return out;
  }

  /* AES: 표 기반 구현. WebCrypto는 패딩이 틀린 PDF에서 실패하고 문자열마다 비동기 호출이 필요해 쓰지 않는다. */
  const SB = new Uint8Array(256), ISB = new Uint8Array(256);
  const T0 = new Uint32Array(256), T1 = new Uint32Array(256), T2 = new Uint32Array(256), T3 = new Uint32Array(256);
  const D0 = new Uint32Array(256), D1 = new Uint32Array(256), D2 = new Uint32Array(256), D3 = new Uint32Array(256);
  (() => {
    const d = new Uint8Array(256);
    for (let i = 0; i < 256; i++) d[i] = i < 128 ? i << 1 : (i << 1) ^ 0x11b;
    let x = 0, xi = 0;
    for (let i = 0; i < 256; i++) {
      let sx = xi ^ (xi << 1) ^ (xi << 2) ^ (xi << 3) ^ (xi << 4);
      sx = (sx >>> 8) ^ (sx & 255) ^ 0x63;
      SB[x] = sx; ISB[sx] = x;
      const x2 = d[x], x4 = d[x2], x8 = d[x4];
      let t = (d[sx] * 0x101) ^ (sx * 0x1010100);
      T0[x] = (t << 24) | (t >>> 8); T1[x] = (t << 16) | (t >>> 16); T2[x] = (t << 8) | (t >>> 24); T3[x] = t;
      t = (x8 * 0x1010101) ^ (x4 * 0x10001) ^ (x2 * 0x101) ^ (x * 0x1010100);
      D0[sx] = (t << 24) | (t >>> 8); D1[sx] = (t << 16) | (t >>> 16); D2[sx] = (t << 8) | (t >>> 24); D3[sx] = t;
      if (!x) { x = xi = 1; } else { x = x2 ^ d[d[d[x8 ^ x2]]]; xi ^= d[d[xi]]; }
    }
  })();

  function expandKey(key) {
    const nk = key.length / 4, nr = nk + 6, n = (nr + 1) * 4, w = new Uint32Array(n);
    for (let i = 0; i < nk; i++) w[i] = (key[4 * i] << 24) | (key[4 * i + 1] << 16) | (key[4 * i + 2] << 8) | key[4 * i + 3];
    const sub = t => (SB[t >>> 24] << 24) | (SB[(t >>> 16) & 255] << 16) | (SB[(t >>> 8) & 255] << 8) | SB[t & 255];
    let rc = 1;
    for (let i = nk; i < n; i++) {
      let t = w[i - 1];
      if (i % nk === 0) {
        t = sub((t << 8) | (t >>> 24)) ^ (rc << 24);
        rc = rc < 128 ? rc << 1 : (rc << 1) ^ 0x11b;
      } else if (nk > 6 && i % nk === 4) t = sub(t);
      w[i] = w[i - nk] ^ t;
    }
    return { w, nr };
  }

  function aesCbcEncrypt(key, iv, data) {
    const { w, nr } = expandKey(key), out = new Uint8Array(data.length);
    let p0 = (iv[0] << 24) | (iv[1] << 16) | (iv[2] << 8) | iv[3], p1 = (iv[4] << 24) | (iv[5] << 16) | (iv[6] << 8) | iv[7],
      p2 = (iv[8] << 24) | (iv[9] << 16) | (iv[10] << 8) | iv[11], p3 = (iv[12] << 24) | (iv[13] << 16) | (iv[14] << 8) | iv[15];
    for (let o = 0; o + 16 <= data.length; o += 16) {
      let s0 = p0 ^ ((data[o] << 24) | (data[o + 1] << 16) | (data[o + 2] << 8) | data[o + 3]) ^ w[0],
        s1 = p1 ^ ((data[o + 4] << 24) | (data[o + 5] << 16) | (data[o + 6] << 8) | data[o + 7]) ^ w[1],
        s2 = p2 ^ ((data[o + 8] << 24) | (data[o + 9] << 16) | (data[o + 10] << 8) | data[o + 11]) ^ w[2],
        s3 = p3 ^ ((data[o + 12] << 24) | (data[o + 13] << 16) | (data[o + 14] << 8) | data[o + 15]) ^ w[3];
      let k = 4;
      for (let r = 1; r < nr; r++) {
        const t0 = T0[s0 >>> 24] ^ T1[(s1 >>> 16) & 255] ^ T2[(s2 >>> 8) & 255] ^ T3[s3 & 255] ^ w[k++];
        const t1 = T0[s1 >>> 24] ^ T1[(s2 >>> 16) & 255] ^ T2[(s3 >>> 8) & 255] ^ T3[s0 & 255] ^ w[k++];
        const t2 = T0[s2 >>> 24] ^ T1[(s3 >>> 16) & 255] ^ T2[(s0 >>> 8) & 255] ^ T3[s1 & 255] ^ w[k++];
        const t3 = T0[s3 >>> 24] ^ T1[(s0 >>> 16) & 255] ^ T2[(s1 >>> 8) & 255] ^ T3[s2 & 255] ^ w[k++];
        s0 = t0; s1 = t1; s2 = t2; s3 = t3;
      }
      p0 = ((SB[s0 >>> 24] << 24) | (SB[(s1 >>> 16) & 255] << 16) | (SB[(s2 >>> 8) & 255] << 8) | SB[s3 & 255]) ^ w[k++];

    const t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
  }
  async function saveFile(filename, data) {
    const blob = data instanceof Blob ? data : new Blob([data]);
    if (window.claude) {
      const dl = await window.claude.use('downloads');
      if (!dl) { toast('이 화면에서는 파일을 저장할 수 없습니다. claude.ai에서 열어 주세요.'); return; }
      try {
        await dl.save({ filename, data: blob });
        toast('저장했습니다.');
      } catch (e) {
        if (e && e.code === 'declined') return;
        toast(e && e.code === 'rate_limited' ? '저장 확인 창이 열려 있습니다. 먼저 처리해 주세요.' : '저장하지 못했습니다. 다시 시도해 주세요.');
      }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.append(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 60000);
    toast('저장했습니다.');
  }
  const unlockedName = item => item.status === 'plain' ? item.name : item.name.replace(/\.pdf$/i, '') + '_해제.pdf';
  const saveable = () => items.filter(i => i.out);

  async function saveAll() {
    const list = saveable();
    if (list.length === 1) return saveFile(unlockedName(list[0]), list[0].out);
    const seen = new Map(), files = list.map(i => {
      let name = unlockedName(i);
      const c = (seen.get(name) || 0) + 1;
      seen.set(name, c);
      if (c > 1) name = name.replace(/\.pdf$/i, ` (${c}).pdf`);
      return { name, data: i.out };
    });
    const d = new Date(), stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    await saveFile(`강의자료_해제_${stamp}.zip`, makeZip(files));
  }

  /* ---------- 화면 ---------- */
  function makeRow(state, name, size, text, strong, opts = {}) {
    const li = document.createElement('li');
    li.className = 'row' + (opts.sample ? ' sample' : '');
    li.dataset.s = state;
    const lock = document.createElement('div');
    lock.className = 'lock';
    lock.innerHTML = state === 'done' || state === 'plain' ? ICON.open : ICON.closed;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const fn = document.createElement('div');
    fn.className = 'fname';
    fn.textContent = name;
    const st = document.createElement('div');
    st.className = 'state';
    if (strong) { const b = document.createElement('b'); b.textContent = strong; st.append(b, text ? ' · ' : ''); }
    st.append(text + (size ? ` · ${fmtSize(size)}` : ''));
    meta.append(fn, st);
    const acts = document.createElement('div');
    acts.className = 'acts';
    li.append(lock, meta, acts);
    return { li, acts };
  }
  function exampleRows() {
    const r = [
      ['done', '운영체제_7주차.pdf', 3355443, '운영체제 열쇠로 열림', '해제됨'],
      ['done', '데이터베이스_중간정리.pdf', 1887436, '데이터베이스 열쇠로 열림', '해제됨'],
      ['wrong', '컴퓨터구조_3장.pdf', 6081740, '열쇠함에 암호를 추가하면 자동으로 다시 시도합니다', '맞는 열쇠 없음']
    ];
    return r.map(a => {
      const { li, acts } = makeRow(...a, { sample: true });
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = '예시';
      acts.append(c);
      return li;
    });
  }
  function describe(i) {
    switch (i.status) {
      case 'queued': return ['대기 중', ''];
      case 'working': return ['암호를 대입하는 중', ''];
      case 'done': return i.free ? ['열람 암호가 없어 바로 열림', '해제됨'] : [`${i.key} 열쇠로 열림`, '해제됨'];
      case 'plain': return ['원래 잠겨 있지 않은 파일', ''];
      case 'wrong': return ['열쇠함에 암호를 추가하면 자동으로 다시 시도합니다', '맞는 열쇠 없음'];
      default: return [i.msg, '처리 실패'];
    }
  }
  function render() {
    const rows = $('rows');
    rows.replaceChildren();
    $('exampleNote').hidden = items.length > 0;
    $('trayHead').hidden = items.length === 0;
    if (!items.length) rows.append(...exampleRows());
    for (const i of items) {
      const [text, strong] = describe(i), { li, acts } = makeRow(i.status, i.name, i.size, text, strong);
      if (i.out) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = '저장';
        b.setAttribute('aria-label', `${i.name} 저장`);
        b.onclick = () => saveFile(unlockedName(i), i.out);
        acts.append(b);
      }
      const x = document.createElement('button');
      x.type = 'button';
      x.textContent = '빼기';
      x.setAttribute('aria-label', `${i.name} 목록에서 빼기`);
      x.onclick = () => { items = items.filter(o => o !== i); render(); };
      acts.append(x);
      rows.append(li);
    }
    const done = items.filter(i => i.status === 'done').length, n = items.length, s = saveable().length;
    const busy = items.some(i => i.status === 'queued' || i.status === 'working');
    $('tally').textContent = busy ? `${n}개 중 ${items.filter(i => !['queued', 'working'].includes(i.status)).length}개 처리됨` : `${n}개 중 ${done}개 해제`;
    const all = $('saveAll');
    all.textContent = s > 1 ? `전체 저장 (ZIP ${s}개)` : '저장';
    all.hidden = s === 0;
    all.disabled = busy;
  }
  function renderKeys() {
    const tags = $('tags');
    tags.replaceChildren();
    $('noKeys').hidden = keys.length > 0;
    tags.hidden = keys.length === 0;
    $('keyCount').textContent = keys.length ? `${keys.length}개` : '';
    for (const k of keys) {
      const li = document.createElement('li');
      li.className = 'tag';
      const top = document.createElement('div');
      top.className = 'tag-top';
      const nm = document.createElement('span');
      nm.className = 'tag-name';
      nm.textContent = k.label || '이름 없는 열쇠';
      const hits = document.createElement('span');
      hits.className = 'tag-hits';
      hits.textContent = k.hits ? `${k.hits}번 사용` : '';
      top.append(nm, hits);
      const pw = document.createElement('div');
      pw.className = 'tag-pw';
      const mask = '•'.repeat(Math.min(k.pw.length, 12));
      pw.textContent = mask;
      const row = document.createElement('div');
      row.className = 'tag-acts';
      const show = document.createElement('button');
      show.type = 'button';
      show.className = 'link';
      show.textContent = '암호 보기';
      show.onclick = () => {
        const on = pw.textContent === mask;
        pw.textContent = on ? k.pw : mask;
        show.textContent = on ? '가리기' : '암호 보기';
      };
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'link';
      del.textContent = '삭제';
      let armed = 0;
      del.onclick = () => {
        if (!armed) {
          del.textContent = '한 번 더 누르면 삭제';
          del.classList.add('armed');
          armed = setTimeout(() => { armed = 0; del.textContent = '삭제'; del.classList.remove('armed'); }, 3000);
          return;
        }
        clearTimeout(armed);
        keys = keys.filter(o => o !== k);
        persist();
        renderKeys();
      };
      row.append(show, del);
      li.append(top, pw, row);
      tags.append(li);
    }
  }

  /* ---------- 입력 ---------- */
  $('keyForm').addEventListener('submit', e => {
    e.preventDefault();
    const pw = $('kPw').value, msg = $('formMsg');
    msg.hidden = true;
    if (!pw) { msg.textContent = '암호를 입력해 주세요.'; msg.hidden = false; $('kPw').focus(); return; }
    if (!addKey($('kLabel').value.trim(), pw)) { msg.textContent = '이미 등록된 암호입니다.'; msg.hidden = false; return; }
    $('kLabel').value = '';
    $('kPw').value = '';
    persist();
    renderKeys();
    retryWrong();
    $('kLabel').focus();
  });
  $('pick').onclick = () => $('file').click();
  $('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  $('saveAll').onclick = saveAll;
  $('clear').onclick = () => { items = []; render(); };
  const drop = $('drop');
  let depth = 0;
  document.addEventListener('dragenter', e => { e.preventDefault(); depth++; drop.classList.add('over'); });
  document.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; drop.classList.remove('over'); } });
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    depth = 0;
    drop.classList.remove('over');
    addFiles(e.dataTransfer.files);
  });
  $('backup').onclick = () => {
    if (!keys.length) { toast('백업할 열쇠가 없습니다.'); return; }
    saveFile('강의자료_열쇠함_백업.json', JSON.stringify({ keys: keys.map(k => ({ label: k.label, pw: k.pw })) }, null, 2));
  };
  $('restore').onclick = () => $('restoreFile').click();
  $('restoreFile').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      let n = 0;
      for (const k of data.keys) if (typeof k.pw === 'string' && k.pw && addKey(String(k.label || ''), k.pw)) n++;
      persist();
      renderKeys();
      retryWrong();
      toast(n ? `열쇠 ${n}개를 불러왔습니다.` : '새로 추가할 열쇠가 없습니다.');
    } catch (err) { toast('백업 파일을 읽지 못했습니다. 열쇠함에서 저장한 파일인지 확인해 주세요.'); }
  };

  render();
  renderKeys();
})();
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
